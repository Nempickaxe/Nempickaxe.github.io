name: Static site checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Typst
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" typst-x86_64-unknown-linux-musl/typst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile CV (Typst to PDF)
        run: typst compile cv/cv.typ cv/Nemish_Kanwar_CV.pdf

      - name: Validate HTML, links, SEO, and sitemap
        run: node scripts/validate-static-site.mjs
