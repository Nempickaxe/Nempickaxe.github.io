name: Static site checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML, links, SEO, and sitemap
        run: node scripts/validate-static-site.mjs
